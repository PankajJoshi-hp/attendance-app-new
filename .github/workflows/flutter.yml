name: Flutter CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v1
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.27.3"

      - name: Install dependencies
        run: flutter pub get

      - name: Run Flutter Analyzer (Lint)
        run: flutter analyze || exit 1

      - name: Set Environment Type
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "BUILD_ENV=production" >> $GITHUB_ENV
          else
            echo "BUILD_ENV=dev" >> $GITHUB_ENV
          fi

      # Setup Shorebird BEFORE building
      - name: Setup Shorebird
        uses: shorebirdtech/setup-shorebird@v1
        with:
          cache: true

      # Build APK using Flutter (since Shorebird doesn't support direct APK builds)
      - name: Build APK
        run: flutter build apk --release

      - name: Set build name based on date and environment
        run: echo "BUILD_NAME=attendance-app-$(date +'%d-%m-%Y').${{ env.BUILD_ENV }}" >> $GITHUB_ENV

      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BUILD_NAME }}
          path: build/app/outputs/flutter-apk/app-release.apk

      # Create Shorebird Release first (only for development)
      - name: Create Shorebird Release
        if: env.BUILD_ENV == 'dev'
        run: |
          shorebird release android

      # Create Shorebird Patch after release (only for development)
      - name: Create Shorebird Patch
        if: env.BUILD_ENV == 'dev'
        run: |
          shorebird patch android