name: Flutter CI/CD with Google Drive

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v1
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.27.3"

      - name: Install dependencies
        run: flutter pub get

      - name: Run Flutter Analyzer (Lint)
        run: flutter analyze || exit 1

      - name: Set Environment Type
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "BUILD_ENV=production" >> $GITHUB_ENV
          else
            echo "BUILD_ENV=dev" >> $GITHUB_ENV
          fi

      # Setup Shorebird BEFORE building
      - name: Setup Shorebird
        uses: shorebirdtech/setup-shorebird@v1
        with:
          cache: true

      # Build APK using Flutter (since Shorebird doesn't support direct APK builds)
      - name: Build APK
        run: flutter build apk --release

      - name: Set build name based on date and environment
        run: echo "BUILD_NAME=attendance-app-$(date +'%d-%m-%Y').${{ env.BUILD_ENV }}" >> $GITHUB_ENV

      - name: Upload Flutter APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BUILD_NAME }}
          path: build/app/outputs/flutter-apk/app-release.apk

      # Create Shorebird Patch after release (only for development)
      - name: Create Shorebird Patch
        if: env.BUILD_ENV == 'dev'
        run: |
          shorebird patch android --release-version=latest

      # To Upload Shorebird Patched APK as well
      - name: Upload Shorebird Patched APK
        if: env.BUILD_ENV == 'dev'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BUILD_NAME }}-shorebird
          path: build/app/outputs/bundle/release/app-release.aab

      # Install Google Drive CLI (gdrive)
      - name: Install gdrive
        run: |
          curl -L -o gdrive.tgz https://github.com/prasmussen/gdrive/releases/latest/download/gdrive-linux-x64.tar.gz
          tar -xvf gdrive.tgz
          sudo mv gdrive /usr/local/bin/gdrive
          sudo chmod +x /usr/local/bin/gdrive
          gdrive version  # Verify installation

      # Decode Google Drive credentials and save as JSON file
      - name: Configure Google Drive API
        run: echo "${{ secrets.GDRIVE_CREDENTIALS }}" | base64 --decode > /home/runner/work/service-account.json

      # Upload APK to Google Drive
      - name: Upload to Google Drive
        env:
          GDRIVE_FOLDER_ID: "18IhGQl2kZrpltqqKUenytMfQ8_86KeID" # Replace this
        run: |
          /usr/local/bin/gdrive --service-account /home/runner/work/service-account.json upload --parent $GDRIVE_FOLDER_ID build/app/outputs/flutter-apk/app-release.apk
